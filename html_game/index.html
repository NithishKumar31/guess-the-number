<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fun and responsive Number Guessing Game with multiple difficulty levels.">
    <title>Number Guessing Game</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <div class="container">
        <!-- Splash Screen -->
        <div id="splash-screen" class="screen active" style="height: 100%; justify-content: center;">
            <img src="logo.png" alt="Game Logo" style="width: 180px; height: 180px; border-radius: 50%; margin-bottom: 20px; object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.2);" class="pulse-win">
            <h1 style="font-size: 2.5rem;">Number Guessy</h1>
            <p style="font-size: 1.2rem;">Loading...</p>
        </div>

        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen">
            <img src="logo.png" alt="Game Logo" style="width: 150px; height: 150px; border-radius: 50%; margin-bottom: 15px; object-fit: cover; box-shadow: 0 8px 16px rgba(0,0,0,0.15);">
            <h1>Number Guessing Game</h1>
            <p>Ready to test your luck?</p>
            <button id="play-btn" class="btn btn-primary" style="width: 200px; margin-top: 20px;">Play</button>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="settings-btn" class="btn btn-outline">Settings</button>
                <button id="prizes-btn" class="btn btn-outline">Prizes</button>
            </div>
        </div>

        <!-- Settings Screen -->
        <div id="settings-screen" class="screen">
            <h1>Settings</h1>
            <div class="input-section" style="justify-content: center; align-items: center; gap: 10px;">
                <label for="sound-toggle" style="font-size: 1.2rem;">Sound Effects:</label>
                <input type="checkbox" id="sound-toggle" checked style="width: 24px; height: 24px;">
            </div>
            <button id="back-settings-btn" class="btn btn-secondary">Back</button>
        </div>

        <!-- Prizes Screen -->
        <div id="prizes-screen" class="screen">
            <h1>My Prizes</h1>
            <p id="prize-count" style="margin-bottom: 10px;">Total Stars: 0</p>
            <div id="prize-list" style="font-size: 2.5rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; min-height: 50px;">
                <!-- Stars go here -->
            </div>
            <button id="back-prizes-btn" class="btn btn-secondary">Back</button>
        </div>

        <!-- Level Selection Screen -->
        <div id="level-screen" class="screen">
            <h1>Select Difficulty</h1>
            <p>Choose your challenge:</p>
            <div class="level-buttons">
                <!-- Data attributes to easily identify difficulty level -->
                <button class="btn btn-level" data-level="easy">Easy (0 - 10)</button>
                <button class="btn btn-level" data-level="medium">Medium (1 - 50)</button>
                <button class="btn btn-level" data-level="hard">Hard (1 - 100)</button>
            </div>
        </div>

        <!-- Gameplay Screen -->
        <div id="game-screen" class="screen">
            <h1 id="game-title">Guess the Number</h1>
            
            <!-- Dynamic range text -->
            <p id="range-text" class="range-text">Guess a number between <span id="min-val">0</span> and <span id="max-val">10</span></p>
            
            <!-- Input area -->
            <div class="input-section">
                <!-- Autocomplete off to prevent annoying popups over the input -->
                <input type="number" id="guess-input" placeholder="Enter your guess" autocomplete="off">
                <button id="guess-btn" class="btn btn-primary">Guess</button>
            </div>
            
            <!-- Feedback and score -->
            <div class="feedback-container">
                <p id="feedback-text" class="feedback-text"></p>
                <p id="attempts-text" class="attempts-text">Lives left: <span id="attempts-count">0</span></p>
            </div>
            
            <!-- End of game or restart actions -->
            <div class="actions">
                <button id="new-game-btn" class="btn btn-secondary">New Game</button>
                <button id="change-level-btn" class="btn btn-outline">Change Level</button>
            </div>
        </div>
    </div>

    <!-- Link to external script -->
    <script src="script.js"></script>
</body>
</html>
